<!DOCTYPE html>
<html>
<head>

<title>Student Performance AI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f7fb;
}

.navbar{
background:linear-gradient(90deg,#355C7D,#6C5B7B);
color:white;
padding:16px 60px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logout{
color:white;
text-decoration:none;
background:#2f4e6b;
padding:8px 16px;
border-radius:6px;
}

.container{
padding:40px 80px;
}

.message{
font-size:20px;
margin-bottom:25px;
color:#333;
}

.form-box{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 6px 15px rgba(0,0,0,0.1);
display:flex;
gap:15px;
align-items:center;
}

input{
padding:12px;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#355C7D;
color:white;
border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
}

.result{
text-align:center;
margin-top:50px;
}

.score-card{
background:white;
display:inline-block;
padding:30px 60px;
border-radius:12px;
box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

.score{
font-size:70px;
color:#355C7D;
font-weight:bold;
}

</style>

</head>

<body>

<div class="navbar">
<h2>📊 Student Performance AI</h2>
<a href="/logout" class="logout">Logout</a>
</div>

<div class="container">

<p class="message">
Enter student data such as study hours, attendance and class participation to predict performance.
</p>

<form action="/predict" method="POST" class="form-box">

<input type="number" step="0.1" name="study_hours" placeholder="Weekly Self Study Hours" required>

<input type="number" step="0.1" name="attendance" placeholder="Attendance Percentage" required>

<input type="number" step="0.1" name="participation" placeholder="Class Participation" required>

<button type="submit">Predict</button>

</form>

{% if prediction %}

<div class="result">

<h2>Predicted Grade</h2>

<div class="score-card">

<div class="score">{{ prediction }}</div>

</div>

<p>Prediction powered by trained Machine Learning model.</p>

</div>

{% endif %}

</div>

</body>
</html>
